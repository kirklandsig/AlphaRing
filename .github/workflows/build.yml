name: build

# Builds WTSAPI32.dll from a clean checkout, so a release's DLL can be matched to a commit.
# The pattern tables (lib/game/inc/<version>/patterns_*.inc) are checked in; regenerating or testing them needs the
# game's binaries, so that stays local (tools/offsets/gen_patterns.py --check, offset_test).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Every offset use is gated
        run: python tools/offsets/check_gates.py

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target WTSAPI32

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/Release/WTSAPI32.dll -Algorithm SHA256).Hash.ToLower()
          "$hash  WTSAPI32.dll" | Tee-Object -FilePath build/Release/WTSAPI32.dll.sha256
          "### WTSAPI32.dll`nSHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: WTSAPI32-${{ github.sha }}
          path: |
            build/Release/WTSAPI32.dll
            build/Release/WTSAPI32.dll.sha256
